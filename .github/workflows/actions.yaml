name: GitHub Actions

# This repository holds two sites on two branches: `main` is pymcu.org and
# `starlight-docs` is docs.pymcu.org. Both are listed here so a push to either
# one gets built and checked; only the docs branch deploys from CI, because
# pymcu.org is deployed by Cloudflare Workers Builds on its own.
on:
  pull_request:
    branches:
      - main
      - starlight-docs
  push:
    branches:
      - main
      - starlight-docs

# A newer push supersedes an in-flight run rather than racing it to the deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `npm ci` va con --legacy-peer-deps mientras el sitio siga en Astro 6 con
# @astrojs/tailwind, cuya ultima version (6.0.2) aun declara peer astro ^3||^4||^5.
# El paquete no tiene sucesor para Astro 6: la salida es migrar a Tailwind 4 con
# @tailwindcss/vite, que es trabajo aparte y toca los estilos.
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Astro 6 requires >=22.12.0, so Node 20 cannot build this site at all.
        node-version:
          - 22
          - 24
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js v${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      # - run: npm test

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run check

  deploy:
    # docs.pymcu.org was the one site nobody deployed automatically: the worker
    # has no git repository connected in Cloudflare, so every release depended
    # on somebody remembering to run `npm run deploy` by hand.
    name: Deploy docs.pymcu.org
    if: github.event_name == 'push' && github.ref == 'refs/heads/starlight-docs'
    # Depende de `build` y no de `check` a proposito: `npm run check` incluye
    # prettier, que falla en 54 ficheros por deuda anterior a este workflow.
    # La puerta correcta para publicar es que el sitio compile; el formato se
    # sigue reportando en su propio job sin bloquear el despliegue.
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - name: Check the Cloudflare credentials are present
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Create them under Settings -> Secrets and variables -> Actions."
            echo "The API token needs the 'Edit Cloudflare Workers' template."
            exit 1
          fi
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
