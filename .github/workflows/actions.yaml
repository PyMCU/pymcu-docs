name: GitHub Actions

# This repository is the source of docs.pymcu.org and nothing else.
#
# CI builds and checks; it does NOT deploy. Publishing is Cloudflare Workers
# Builds, connected to this repo's main branch, so the deploy command lives in
# the Cloudflare dashboard and no API token is stored here.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# A newer push supersedes an in-flight run rather than racing it to the deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `npm ci` va con --legacy-peer-deps mientras el sitio siga en Astro 6 con
# @astrojs/tailwind, cuya ultima version (6.0.2) aun declara peer astro ^3||^4||^5.
# El paquete no tiene sucesor para Astro 6: la salida es migrar a Tailwind 4 con
# @tailwindcss/vite, que es trabajo aparte y toca los estilos.
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Astro 6 requires >=22.12.0, so Node 20 cannot build this site at all.
        node-version:
          - 22
          - 24
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js v${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      # - run: npm test

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run check
